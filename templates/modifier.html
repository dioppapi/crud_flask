<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modifier un produit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>✏️ Modifier le produit</h1>
        
        <a href="{{ url_for('liste') }}" class="btn-back">← Retour à la liste</a>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('modifier', id_produit=produit.id) }}" class="form-produit">
            <div class="form-group">
                <label for="nom">Nom du produit</label>
                <input type="text" id="nom" name="nom" required value="{{ produit.nom }}">
            </div>
            
            <div class="form-group">
                <label for="prix">Prix</label>
                <input type="number" step="0.01" id="prix" name="prix" required value="{{ produit.prix }}">
            </div>
            
            <div class="form-group">
                <label for="quantite">Quantité</label>
                <input type="number" id="quantite" name="quantite" required value="{{ produit.quantite }}">
            </div>
            
            <div class="form-group">
                <label for="categorie">Catégorie</label>
                <input type="text" id="categorie" name="categorie" value="{{ produit.categorie or '' }}">
            </div>
            
            <button type="submit" class="btn-submit">Mettre à jour</button>
        </form>
        
        <div class="info-db" style="margin-top: 30px;">
            <div class="info-content">
                <div><strong>👤 Étudiant :</strong> Mamadou Abou Diop</div>
                <div><strong>📚 Classe :</strong> L1 Informatique</div>
                <div><strong>📞 Numéro :</strong> 44894357</div>
            </div>
        </div>
    </div>
</body>
</html>
